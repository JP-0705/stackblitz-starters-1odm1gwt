<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — IMS</title>
    <link rel="stylesheet" href="/shared/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="standalone-auth-page">
    <div class="bg-decor">
      <div class="bg-glow"></div>
      <div class="bg-barcode"></div>
    </div>
    <div class="auth-card">
      <div class="auth-title"><img src="https://i.ibb.co/mVgtpqGB/INNOVPHIL-LOGO-Blue.png" alt="INNOVPHIL-LOGO-Blue"></div>
      <p class="gt-title">Welcome back</h1>
      <p class="auth-subtitle">Login to continue managing your Inventory</p>
      <input type="email" required id="authEmail" class="auth-input" placeholder="Email" />
      <input type="password" required id="authPassword" class="auth-input" placeholder="Password"/>
      <button onclick="executeLoginGate()" id="authSubmitBtn" class="auth-btn" >LOGIN</button>
      <div id="authErrorMsg" class="auth-error">Incorrect Email or Password.</div>
      <p class="auth-signup-link">
        <a href="#" onclick="toggleForgotPassword(); return false;">Forgot password?</a>
      </p>
      <p class="auth-signup-link">
        Don't have an account?
        <a href="/create-account/">Create one</a>
      </p>

      <div id="forgotPasswordSection" style="display:none;">
        <p class="auth-subtitle" style="margin-top:16px;">Enter your email and we'll send you a reset link.</p>
        <input type="email" id="forgotPasswordEmail" class="auth-input" placeholder="Email" />
        <div id="forgotPasswordMsg" class="auth-error"></div>
        <button onclick="executeForgotPassword()" id="forgotPasswordBtn" class="auth-btn">SEND RESET LINK</button>
        <p class="auth-signup-link">
          <a href="#" onclick="toggleForgotPassword(); return false;">Back to login</a>
        </p>
      </div>
    </div>

    <script src="/config/supabase-config.js"></script>
    <script src="/shared/supabase-client.js"></script>
    <script src="/login/login.js"></script>

    <style>
      
    </style>
  </body>
</html>
